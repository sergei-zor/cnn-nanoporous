name: Push image to ECR

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  id-token: write # needed to log in to AWS with OpenID Connect
  contents: read

env:
  AWS_REGION: eu-west-1
  ECR_REPOSITORY: nanoporous-api
  AWS_ROLE_ARN: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/github-actions-nanoporous

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Build Docker image
        # SageMaker accepts a single image only, without the build attestations Docker adds by default
        run: docker build --provenance=false --sbom=false -t nanoporous-api .

      - name: Check SageMaker serving mode
        run: |
          docker run -d -p 8080:8080 -e MODEL_PATH=models/model_DenseNet201.pth --name serve-test nanoporous-api serve
          for i in {1..20}; do
            if curl -sf http://localhost:8080/ping; then break; fi
            echo "Waiting for /ping"
            sleep 3
          done
          curl -sf -X POST --data-binary @exemplary_structures/155_rot-z.npy \
            -H "Content-Type: application/octet-stream" http://localhost:8080/invocations

      - name: Logs
        if: failure()
        run: docker logs serve-test

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Push image
        run: |
          IMAGE=${{ steps.ecr.outputs.registry }}/$ECR_REPOSITORY
          docker tag nanoporous-api $IMAGE:${GITHUB_SHA::7}
          docker tag nanoporous-api $IMAGE:latest
          docker push --all-tags $IMAGE
          echo "Pushed tags ${GITHUB_SHA::7} and latest"
